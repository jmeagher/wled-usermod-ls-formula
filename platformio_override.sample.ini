; Example WLED build environments for this usermod.
;
; USING IT (no checkout of this repo needed): copy one [env:...] block with the git URL into the
; platformio_override.ini at the top of your WLED checkout, then `pio run -e <env>`.
;
; DEVELOPING IT: scripts/dev-setup.sh copies this file to .wled/platformio_override.ini with
; __USERMOD_PATH__ replaced by your working tree, so the symlink:// lines below apply.
;
; IMPORTANT: WLED reads custom_usermods line by line. Put each entry (including the inherited
; ${env:...custom_usermods} and the usermod's URL) on its own line, as below. A URL on the same line as
; bare names is treated as a name and the build fails with "Couldn't locate module".
;
; The usermod needs a WLED with the usermod API of v16 / main. ESP32-C6 builds exist only on WLED
; main (they are marked experimental there) and not in a release yet.

[platformio]
default_envs = lsf_esp32c6

; --- From GitHub (pin a tag for a reproducible build) -----------------------------------------
[env:lsf_git_esp32dev]
extends = env:esp32dev
custom_usermods =
  ${env:esp32dev.custom_usermods}
  https://github.com/jmeagher/wled-usermod-ls-formula.git#v0.1.0

; --- From a local clone (what scripts/dev-setup.sh uses) --------------------------------------
[env:lsf_esp32dev]
extends = env:esp32dev
custom_usermods =
  ${env:esp32dev.custom_usermods}
  symlink://__USERMOD_PATH__

; Waveshare ESP32-C6-Touch-LCD-1.47 or any ESP32-C6 with 8 MB flash. GPIO 7 as the default LED pin;
; set the LED count and pin in the WLED UI after the first boot.
[env:lsf_esp32c6]
extends = env:esp32c6dev_8MB
custom_usermods =
  ${env:esp32c6dev_8MB.custom_usermods}
  symlink://__USERMOD_PATH__
build_flags = ${env:esp32c6dev_8MB.build_flags} -D DATA_PINS=7

; Any ESP32-C6 with 4 MB flash (e.g. ESP32-C6FH4 boards: ESP32-C6-DevKitM-1, many clones). Do NOT flash the
; 8 MB environment above onto a 4 MB chip: its partition table does not fit. Check with
; `esptool flash_id` ("Detected flash size"). GPIO 7 is only the default LED pin; change it in the WLED UI.
[env:lsf_esp32c6_4MB]
extends = env:esp32c6dev_4MB
custom_usermods =
  ${env:esp32c6dev_4MB.custom_usermods}
  symlink://__USERMOD_PATH__
build_flags = ${env:esp32c6dev_4MB.build_flags} -D DATA_PINS=7

[env:lsf_esp32s3]
extends = env:esp32s3dev_8MB_qspi
custom_usermods =
  ${env:esp32s3dev_8MB_qspi.custom_usermods}
  symlink://__USERMOD_PATH__

; --- Tuning (add to any env's build_flags) -----------------------------------------------------
;   -D LSF_SLOTS=2             register 2 effect slots instead of 4 (1..4)
;   -D LSF_BUDGET_US=10000     per-frame time budget for admission control (default 15000)
;   -D LSF_US_PER_COST_X10=2   speed-estimate calibration for a faster chip (default 3, ESP32-C6)
;   -D LSF_BTN_HOLD_MS=700     button: press this long (ms) is a hold (default 500); also LSF_BTN_DOUBLE_MS (350),
;                              LSF_BTN_STEP_MS (250, time between brightness steps) and LSF_BTN_DEBOUNCE_MS (30)
;   -D LSF_MAX_INSNS=384       longer programs (default 256; costs 8 bytes of RAM each, per slot)
